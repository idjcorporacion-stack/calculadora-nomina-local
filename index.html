<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Nómina - Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; color: #1f2937; }
        .shadow-custom { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        .btn-primary { @apply bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700 transition duration-150; }
        .btn-success { @apply bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition duration-150; }
        .btn-danger { @apply bg-red-500 text-white px-3 py-1 rounded-lg text-xs hover:bg-red-600 transition duration-150; }
        .btn-edit { @apply bg-blue-500 text-white px-3 py-1 rounded-lg text-xs hover:bg-blue-600 transition duration-150; }
        .btn-outline { @apply border-2 border-green-600 text-green-700 px-4 py-2 rounded-lg font-bold hover:bg-green-50 transition duration-150; }
        
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div id="edit-modal" class="modal">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Editar Turno</h2>
            <form onsubmit="saveEdit(event)">
                <input type="hidden" id="edit-id">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Fecha</label>
                    <input type="date" id="edit-date" required class="w-full p-2 border rounded-lg">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Entrada</label>
                        <input type="time" id="edit-start" required class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Salida</label>
                        <input type="time" id="edit-end" required class="w-full p-2 border rounded-lg">
                    </div>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-gray-500 font-bold">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-custom mb-8 border-b-4 border-indigo-500">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800">📊 Mi Nómina Local</h1>
                <p class="text-sm text-gray-500 font-medium">Los datos se guardan en tu navegador</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="document.getElementById('excel-upload').click()" class="btn-outline flex items-center gap-2">Subir Excel</button>
                <input type="file" id="excel-upload" class="hidden" accept=".xlsx, .xls" onchange="importFromExcel(event)">
                <button onclick="exportToExcel()" class="btn-success flex items-center gap-2">Descargar Excel</button>
                <button onclick="clearAllData()" class="text-red-500 hover:text-red-700 font-bold text-xs underline ml-2">Borrar Todo</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-custom border border-indigo-100">
                    <h3 class="text-sm font-bold text-indigo-900 mb-4">Tarifa $/Hora</h3>
                    <input type="number" id="hourly-rate" value="2.0125" step="0.0001" onchange="renderShifts()" class="w-full text-2xl font-bold p-3 rounded-xl border-2 border-indigo-50 outline-none text-indigo-700 bg-indigo-50/30">
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-custom border border-red-100">
                    <h3 class="text-sm font-bold text-red-900 mb-4">Feriados</h3>
                    <form onsubmit="addHoliday(event)" class="flex gap-2 mb-4">
                        <input type="date" id="holiday-date-input" class="p-2 rounded-lg border flex-1 outline-none">
                        <button type="submit" class="bg-red-500 text-white w-10 h-10 rounded-lg">+</button>
                    </form>
                    <ul id="holidays-list" class="space-y-1"></ul>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-custom border border-blue-100 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <h3 class="text-sm font-bold text-blue-900">Generar Mes</h3>
                        <p class="text-xs text-gray-400">Crea 30 turnos automáticamente.</p>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="month" id="month-year-input" class="p-2 border rounded-lg text-sm">
                        <button onclick="generateDefaultShifts()" class="btn-primary">Generar</button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-custom border border-green-100">
                    <form onsubmit="addShift(event)" class="grid grid-cols-2 md:grid-cols-4 gap-4 items-end">
                        <div><label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Fecha</label><input type="date" name="shift-date" required class="w-full p-2 border rounded-lg text-sm"></div>
                        <div><label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Entrada</label><input type="time" name="start-time" value="08:30" required class="w-full p-2 border rounded-lg text-sm"></div>
                        <div><label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Salida</label><input type="time" name="end-time" value="17:00" required class="w-full p-2 border rounded-lg text-sm"></div>
                        <button type="submit" class="btn-success text-sm">Añadir</button>
                    </form>
                </div>

                <div class="bg-white rounded-2xl shadow-custom overflow-hidden overflow-x-auto">
                    <table class="min-w-full text-center">
                        <thead class="bg-gray-50 text-[10px] font-black text-gray-400 border-b">
                            <tr>
                                <th class="px-4 py-4 text-left">Fecha</th><th class="px-2">Entrada</th><th class="px-2">Salida</th><th class="px-2">H. Pagadas</th><th class="px-2">Norm.</th><th class="px-2">50%</th><th class="px-2">100%</th><th class="px-2">Noct.</th><th class="px-2">Pago</th><th class="px-4 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="shifts-body" class="divide-y divide-gray-100"></tbody>
                        <tfoot class="bg-gray-50/50">
                            <tr id="totals-row"></tr>
                            <tr id="guaranteed-salary-row"></tr>
                            <tr id="final-total-row"></tr>
                            <tr id="iess-row"></tr>
                            <tr id="quincena-row"></tr>
                            <tr id="neto-row"></tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
